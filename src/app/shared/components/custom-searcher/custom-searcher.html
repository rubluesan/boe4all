<form action="">
    <label for="dia">Día:</label>
    <input type="number" id="dia" [(ngModel)]="data().day" />
    <label for="mes">Mes:</label>
    <input type="number" id="mes" [(ngModel)]="data().month" />
    <label for="año">Año:</label>
    <input type="number" id="año" [(ngModel)]="data().year" />
</form>
